<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="升小數學面試" />
  <meta name="theme-color" content="#1a0a4e" />
  <meta name="description" content="升小面試數學練習 — 神小風格模擬 · 數數、規律、比多少、加減、圖形 · 廣東話朗讀" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>升小數學面試練</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <header class="hero">
        <div class="hero-art" aria-hidden="true">
          <span class="blob b1"></span>
          <span class="blob b2"></span>
          <span class="blob b3"></span>
          <div class="hero-icons">
            <span class="hi">🔢</span>
            <span class="hi">⭐</span>
            <span class="hi">🔷</span>
          </div>
        </div>
        <h1 class="title">升小數學面試練</h1>
        <p class="intro">K3–小一 · 數感 · 規律 · 口頭推理</p>
      </header>

      <div class="diff-block diff-chosen" id="diff-block" role="group" aria-label="難度">
        <p class="diff-label">先揀難度，再開始</p>
        <div class="diff-row" id="diff-row">
          <button type="button" class="diff-btn" data-diff="easy" aria-pressed="false">
            <span class="diff-check" aria-hidden="true">✓</span>
            <strong>基礎</strong>
            <small>細數字 · 輕鬆</small>
          </button>
          <button type="button" class="diff-btn active" data-diff="medium" aria-pressed="true">
            <span class="diff-check" aria-hidden="true">✓</span>
            <strong>進階</strong>
            <small>面試常見</small>
          </button>
          <button type="button" class="diff-btn" data-diff="hard" aria-pressed="false">
            <span class="diff-check" aria-hidden="true">✓</span>
            <strong>神小挑戰</strong>
            <small>大啲 · 趕啲</small>
          </button>
        </div>
        <p class="diff-selected" id="diff-selected">已選：進階</p>
      </div>

      <div class="mode-stack">
        <button type="button" class="mode-card mock" id="btn-mock">
          <span class="mode-emoji">🏫</span>
          <span class="mode-body">
            <strong>神小風格模擬</strong>
            <small>混合題型短輪 · 偏規律／比較／圖畫應用</small>
          </span>
          <span class="mode-arrow">›</span>
        </button>
        <button type="button" class="mode-card practice" id="btn-practice-menu">
          <span class="mode-emoji">📚</span>
          <span class="mode-body">
            <strong>分類練習</strong>
            <small>揀一種題型慢慢練</small>
          </span>
          <span class="mode-arrow">›</span>
        </button>
      </div>

      <div class="home-opts">
        <label class="toggle">
          <input type="checkbox" id="opt-timer" />
          <span id="opt-timer-label">模擬加計時（每題約 45 秒）</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="opt-auto-read" />
          <span>自動廣東話朗讀題目</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="opt-mute" />
          <span>靜音（關閉朗讀同音效）</span>
        </label>
      </div>

      <a class="hub-link" href="https://tlc-cmyk.github.io/primary-prep-hub/">🏠 返主頁</a>
      <p class="home-foot">專為 iPhone 設計 · 可加入主畫面 · 支援 zh-HK 朗讀</p>
    </section>

    <!-- FORMAT PICKER -->
    <section id="screen-formats" class="screen">
      <header class="top-bar">
        <button type="button" class="icon-btn" id="btn-formats-back" aria-label="返回">←</button>
        <h2 class="top-title">分類練習</h2>
        <span class="top-spacer"></span>
      </header>
      <p class="hint">撳一種題型開始 · 每輪 8 題</p>
      <div id="format-list" class="format-list"></div>
    </section>

    <!-- PLAY -->
    <section id="screen-play" class="screen">
      <header class="play-bar">
        <button type="button" class="icon-btn" id="btn-play-quit" aria-label="結束">✕</button>
        <div class="play-meta">
          <span id="play-mode-label" class="play-mode">練習</span>
          <span id="play-progress" class="play-progress">1 / 8</span>
        </div>
        <div id="timer-wrap" class="timer-wrap hidden" aria-live="polite">
          <span id="timer-sec">45</span>
        </div>
      </header>

      <div id="q-card" class="q-card">
        <div class="q-prompt-row">
          <p id="q-prompt" class="q-prompt"></p>
          <button type="button" class="speak-btn" id="btn-speak" aria-label="廣東話朗讀題目" title="廣東話朗讀">
            🔊
          </button>
        </div>
        <p id="tts-hint" class="tts-hint hidden" role="status" aria-live="polite"></p>
        <div id="q-visual" class="q-visual" aria-hidden="false"></div>
        <div id="q-choices" class="q-choices" role="group" aria-label="答案"></div>
      </div>

      <div id="feedback" class="feedback hidden" role="status" aria-live="polite">
        <p id="feedback-text"></p>
        <button type="button" class="next-btn" id="btn-next">下一題 ›</button>
      </div>
    </section>

    <!-- RESULT -->
    <section id="screen-result" class="screen">
      <div class="result-card">
        <div class="result-stars" id="result-stars" aria-hidden="true">⭐⭐⭐</div>
        <h2 class="result-title" id="result-title">做得好！</h2>
        <p class="result-diff" id="result-diff"></p>
        <p class="result-score" id="result-score">8 / 8</p>
        <p class="result-msg" id="result-msg">繼續加油！</p>
        <div class="result-actions">
          <button type="button" class="primary-btn" id="btn-again">再玩一次</button>
          <button type="button" class="ghost-btn" id="btn-home">返主選單</button>
        </div>
      </div>
      <a class="hub-link" href="https://tlc-cmyk.github.io/primary-prep-hub/">🏠 返主頁</a>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
